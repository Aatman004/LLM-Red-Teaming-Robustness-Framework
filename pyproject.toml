[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-redteaming-framework"
version = "0.1.0"
description = "Automated adversarial testing and red-teaming pipeline for LLMs against jailbreaks and prompt injections."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aatman Gupta", email = "aatmangupta8@gmail.com" }
]
keywords = [
    "ai-safety",
    "red-teaming",
    "jailbreak-detection",
    "prompt-injection",
    "adversarial-robustness",
    "asr-analytics"
]
dependencies = [
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
redteam = "redteam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
